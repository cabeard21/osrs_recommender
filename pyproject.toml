[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-pvp-progression-tracker"
version = "0.1.0"
description = "Locally hosted OSRS Wilderness PvP progression tracker (see docs/SDD.md)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "nicegui",
    "sqlalchemy",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "pyyaml",
    "jsonschema",
    "plotly",
    "mcp>=2.2,<3",
    # §21.4 — task guidance provider. Imported only by tracker/integrations/llm/, and only
    # constructed when integrations.llm.enabled and a key resolves (D14: off changes nothing).
    # 1.x migrated the SDK's transport layer to httpx2. The provider's injected test seam and
    # the rest of this application deliberately share httpx, so stay on the compatible SDK
    # generation until that migration is made end-to-end.
    "anthropic>=0.121,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-playwright",
    "nicegui[testing]",
    "ruff",
    "mypy",
    "hypothesis",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
include = ["contracts", "tracker*"]

[tool.setuptools.package-data]
contracts = ["*.json"]

# --------------------------------------------------------------------------
# ruff — lint + format
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# `.claude/worktrees/` holds live checkouts of other branches during parallel work;
# linting them would report another unit's in-progress code as this one's failure.
extend-exclude = [".venv", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # This codebase quotes the SDD constantly, and the SDD is written with typographic
    # punctuation (§, em dash, en dash, →). Flagging those as "ambiguous unicode" would
    # mean paraphrasing the specification in every docstring that cites it.
    "RUF001",
    "RUF002",
    "RUF003",
    # SIM300 flags `Confidence.HIGH >= bar` as a Yoda condition. That is the exact
    # notation §6.9 uses — `readiness_confidence >= capability.recommended_readiness` —
    # and inverting it to `bar <= Confidence.HIGH` obscures which side is the threshold.
    "SIM300",
]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------
# mypy — strict over the pure core only (§16.1)
#
# The pure core is where three-valued logic lives; strictness there is what
# keeps `Tri` from silently decaying into `bool | None` (G2/G3, D8).
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true  # global-only flag; mypy rejects it in a per-module section
ignore_missing_imports = true
# `tests/` has no `__init__.py` anywhere — deliberately, so pytest resolves each
# directory's `conftest.py` per directory. Without this flag mypy derives a module name
# from the basename alone: every `conftest.py` becomes the module `conftest`, and the
# second one added to the tree is a hard "Duplicate module named conftest" error that
# aborts the run before it checks anything. Anchoring the package base at the repo root
# names them by path instead — `tests.db.conftest`, `tests.progression.conftest`,
# `tests.estimation.conftest` — so they no longer collide.
#
# Steps 3b and 5 each hit this independently and added the same two lines. See the pytest
# section below for the collection-time twin of the same problem.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "tracker.domain.*",
    "tracker.content.*",
    "tracker.freshness.*",
    "tracker.progression.*",
    "tracker.recommendations.*",
    "tracker.estimation.*",
    # §21.2 — context assembly is pure by the same rule and held to the same bar. Nothing here
    # reaches a ranking (D14), but everything here feeds a hash the cache depends on.
    "tracker.guidance.*",
    # §22.2 — the advisor's digest and tool dispatch are pure for a stronger reason than the
    # rest: D15 makes purity the *enforcement* of "tools cannot write", not merely its style.
    # A session reaching this package would be a bug the type checker should catch first.
    "tracker.advisor.*",
    # §23 — the gear projection, held to the advisor's bar rather than to guidance's, because
    # the advisor imports it. Its purity is a component of D15's guarantee, not a style choice.
    "tracker.gear.*",
    "tracker.accounts.*",
    "tracker.quest_cape.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `importlib` import mode, for the same reason `explicit_package_bases` is set for mypy
# above: `tests/` has no `__init__.py`, so under the legacy `prepend` mode every test
# module is imported by its bare basename and two files sharing one — `tests/db/test_types.py`
# and `tests/domain/test_types.py` — collide during collection and abort the whole run.
# Renaming one would work until the next collision; this removes the class of failure.
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
    "browser: Playwright tests of retained rendered workflows; excluded from fast make test",
    "contract: cross-language payload fixtures (§12.1)",
    # §21.4 — reserved for a manual smoke test against a real provider. Deliberately not
    # excluded in `addopts`: no such test exists, and `--strict-markers` plus the structural
    # guards (no provider is built without a transport or a key) keep the suite offline.
    "llm_live: hits a real guidance provider; never run by `make test` (§21.4)",
]
# The tuner imports the retained golden corpus loader from `tests.golden`.
# `--import-mode=importlib` adds nothing to sys.path, so a bare `pytest` needs the root.
pythonpath = ["."]
