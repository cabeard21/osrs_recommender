[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-pvp-progression-tracker"
version = "0.1.0"
description = "Locally hosted OSRS Wilderness PvP progression tracker (see docs/SDD.md)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "nicegui",
    "sqlalchemy",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "pyyaml",
    "jsonschema",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-playwright",
    "nicegui[testing]",
    "ruff",
    "mypy",
    "hypothesis",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
include = ["tracker*"]

# --------------------------------------------------------------------------
# ruff — lint + format
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# `.claude/worktrees/` holds live checkouts of other branches during parallel work;
# linting them would report another unit's in-progress code as this one's failure.
extend-exclude = [".venv", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # This codebase quotes the SDD constantly, and the SDD is written with typographic
    # punctuation (§, em dash, en dash, →). Flagging those as "ambiguous unicode" would
    # mean paraphrasing the specification in every docstring that cites it.
    "RUF001",
    "RUF002",
    "RUF003",
    # SIM300 flags `Confidence.HIGH >= bar` as a Yoda condition. That is the exact
    # notation §6.9 uses — `readiness_confidence >= capability.recommended_readiness` —
    # and inverting it to `bar <= Confidence.HIGH` obscures which side is the threshold.
    "SIM300",
]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------
# mypy — strict over the pure core only (§16.1)
#
# The pure core is where three-valued logic lives; strictness there is what
# keeps `Tri` from silently decaying into `bool | None` (G2/G3, D8).
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true  # global-only flag; mypy rejects it in a per-module section
ignore_missing_imports = true
# `tests/` has no `__init__.py` anywhere, so mypy derives a module name from each file's
# nearest non-package ancestor: every `conftest.py` becomes the module `conftest` and the
# second one added to the tree is a hard "Duplicate module named conftest" error that
# stops the run before it checks anything. Anchoring the package base at the repo root
# instead names them `tests.db.conftest` / `tests.progression.conftest`, which is also how
# a test module already imports a sibling directory's shared constants.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "tracker.domain.*",
    "tracker.content.*",
    "tracker.freshness.*",
    "tracker.progression.*",
    "tracker.recommendations.*",
    "tracker.estimation.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `importlib` import mode, for the same reason `explicit_package_bases` is set for mypy
# below: `tests/` has no `__init__.py`, so under the legacy `prepend` mode every test
# module is imported by its bare basename and two files sharing one — `tests/db/test_types.py`
# and `tests/domain/test_types.py` — collide during collection and abort the whole run.
# Renaming one would work until the next collision; this removes the class of failure.
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
    "golden: golden-corpus ranking judgments (§16.2)",
    "contract: cross-language payload fixtures (§12.1)",
]
