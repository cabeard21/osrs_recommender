# One conservative default per melee skill. Deliberately unambitious rates: an estimate
# that is pessimistic and right beats one that is optimistic and wrong, because §9.4
# ranks on effort_decay and an understated cost cannot flatter a candidate.
- id: attack_conservative
  name: Attack — conservative default
  skill: attack
  xp_per_hour: 45000
  level_range: {min: 1, max: 99}
  cost_per_hour_gp: 30000
  detail:
    # A rate floor, not a place to go — see magic.yaml's magic_conservative for why this
    # deliberately carries no location, target or gear.
    notes: >-
      No specific method — a deliberately pessimistic rate that any reasonable training
      choice should beat. Treat the hours as an upper bound.

