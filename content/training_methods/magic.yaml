# §8.1 verbatim. The fast method is gated behind the very content the recommender is
# trying to sequence, which is why §8.2 step 3 selects per band among methods the
# player *currently* satisfies rather than among all methods.
#
# `detail` is §15's "How" line and is **descriptive only** — never read by the scorer or
# the estimator. tests/content/test_method_detail.py asserts that two corpora differing
# only in `detail` produce byte-identical recommendations, because otherwise an author
# could promote a candidate by writing a better description of it (§10.6).
- id: magic_bursting
  name: Magic bursting
  skill: magic
  xp_per_hour: 250000
  level_range: {min: 82, max: 99}
  cost_per_hour_gp: 400000
  requires:
    all_of:
      - unlock: ancient_magicks
      - quest: desert_treasure_i
  detail:
    location: Catacombs of Kourend, or the Smoke Dungeon
    target: Nechryael (Slayer 80) or Dust devils (Slayer 65)
    # Free text, never `item:` leaves. An item leaf would be resolved by the evaluator
    # and flow into the GP estimate, so naming a Kodai wand for display would silently
    # reprice this method for anyone who does not own one. Gear that must *gate* a method
    # belongs in `requires` above, which is checked.
    gear:
      - Occult necklace
      - Ancestral or Ahrim's robes
      - Kodai wand or Master wand
      - Tome of water
    inventory:
      - Death runes
      - Blood runes
      - Water runes (or a charged tome)
      - Prayer potions
      - Stamina potions
      - Food
    notes: >-
      Multi-target: the quoted rate assumes near-constant stacks, so it is a ceiling on a
      good spot rather than an average. The fastest targets carry their own Slayer
      requirements, which this corpus does not gate on — `requires` above lists only what
      it does check, so a band may be offered before the best spot is actually reachable.
    wiki_url: https://oldschool.runescape.wiki/w/Ice_Burst

# The conservative default: no requirements, so it is always available and every band
# is covered. §8.2's fallback exists for bands even this does not reach.
- id: magic_conservative
  name: Magic — conservative default
  skill: magic
  xp_per_hour: 35000
  level_range: {min: 1, max: 99}
  cost_per_hour_gp: 40000
  detail:
    # No location, target or gear, and that is the honest authoring rather than an
    # omission: this entry is a *rate floor* covering whatever the player chooses, not a
    # place to go. Inventing a specific spot would make the estimate look better
    # understood than it is, which is the failure §8.2's conservative default exists to
    # avoid in the first place.
    notes: >-
      No specific method — a deliberately pessimistic rate that any reasonable training
      choice should beat. Treat the hours as an upper bound. Describing a real method for
      this band, with its own requirements, is what would replace it.
