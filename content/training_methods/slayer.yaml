# §8.1 for Slayer.
#
# Authored because the corpus previously held **no** Slayer method at all, while the PvM
# capability ladder gates on Slayer levels and `tools/generate_candidates.py` emits a band
# candidate for every one of them. The estimator therefore fell through to its conservative
# default for every Slayer band, and §22.4's `list_training_methods` returned nothing — so
# an advisor asked *"what should I bring to crocodiles?"* had to answer entirely from its own
# knowledge of the game.
#
# Requirements use `skill:` leaves only. A Slayer master's real gate is a combat level and a
# quest apiece; naming quests here would tie this file to quest ids the corpus may not declare,
# and §10.7's referential integrity would reject the file rather than the rate being slightly
# optimistic. The levels below are therefore the *honest* part of the gate and the notes carry
# the rest — the same trade `magic_bursting` makes when it says its fastest targets carry
# Slayer requirements this corpus does not check.
#
# `detail` is §15's "How" line and is **descriptive only** — never read by the scorer or the
# estimator (tests/content/test_method_detail.py).

- id: slayer_early_tasks
  name: Slayer — early tasks (Turael or Spria)
  skill: slayer
  # Above §8.2's `FALLBACK_XP_PER_HOUR`, and that bound is not a formality: the fallback is
  # what an *unauthored* band is charged, so an authored method slower than it would make
  # describing a method worse than leaving it undescribed — §9.4 ranks on `effort_decay`, and
  # the least-understood candidate would come out ahead. If early Slayer is genuinely slower
  # than this, the fallback is the number that should move, not this one.
  xp_per_hour: 18000
  level_range: {min: 1, max: 30}
  cost_per_hour_gp: 5000
  detail:
    location: Burthorpe (Turael) or Draynor Village (Spria)
    target: >-
      Low-level assignments — birds, bats, cows, monkeys, and the occasional crocodile task
      once other masters are in reach.
    gear:
      - Any weapon the assignment is weak to
      - Whatever armour you already own
    inventory:
      - Food
      - Teleports to the task area
    notes: >-
      Rates here are dominated by travel rather than by combat, so the figure is a rough
      average across a mixed task list rather than a rate for any one monster. Skipping long
      or slow assignments costs points you do not have yet, which is why this band is slower
      than its combat stats alone would suggest.
    wiki_url: https://oldschool.runescape.wiki/w/Slayer

- id: slayer_mid_tasks
  name: Slayer — mid-level tasks (Vannaka or Chaeldar)
  skill: slayer
  xp_per_hour: 25000
  level_range: {min: 30, max: 75}
  cost_per_hour_gp: 40000
  # No `requires`, deliberately. An earlier draft carried `skill: {attack: 40}` as a stand-in
  # for "can hold a rune weapon" — but `corpus_skill_levels` reads requirement leaves as band
  # boundaries, so a *fabricated* gate on one skill silently re-cut another skill's band
  # ladder. A requirement here has to be a real gate or not be written: the master's actual
  # gate is a combat level this corpus does not model, and `level_range` below already keeps
  # this method out of the levels it does not describe.
  detail:
    location: >-
      Edgeville Dungeon (Vannaka), or Zanaris (Chaeldar — members, and the fairy ring network
      makes the difference to the rate below).
    target: >-
      Mid-tier assignments — crocodiles in the Kharidian Desert east of Sophanem, bloodvelds,
      dust devils, jellies and similar. Crocodiles carry no Slayer level requirement of their
      own; they appear once a master with a wide task list is being used.
    # Free text, never `item:` leaves. An item leaf would be resolved by the evaluator and
    # flow into the GP estimate, so naming a whip for display would silently reprice this
    # method for anyone who does not own one (§10.5).
    gear:
      - The best melee weapon you own for the assignment
      - Rune or better body and legs
      - Amulet of glory (also a teleport to the desert edge)
      - Slayer helmet, or a nose peg / earmuffs / face mask as the task demands
    inventory:
      - Food
      - Prayer potions if the assignment hits hard
      - Waterskins for any desert task, crocodiles included
      - Teleports out
    notes: >-
      The quoted rate assumes tasks are being done rather than skipped, and includes travel.
      Desert assignments need waterskins or the desert damage will end the trip early — that
      is the single most common way a crocodile task goes wrong. The rate assumes rune-tier
      melee gear; the masters' own gates are combat levels and quests this corpus does not
      model, so nothing here is checked beyond the level range.
    wiki_url: https://oldschool.runescape.wiki/w/Slayer

- id: slayer_high_tasks
  name: Slayer — high-level tasks (Nieve or Duradel)
  skill: slayer
  xp_per_hour: 45000
  level_range: {min: 75, max: 99}
  cost_per_hour_gp: 250000
  requires:
    all_of:
      - skill: {attack: 70}
      - skill: {defence: 70}
  detail:
    location: Tree Gnome Stronghold (Nieve) or Shilo Village (Duradel)
    target: >-
      Abyssal demons, gargoyles, nechryael, kraken and similar — the assignments that carry
      both the XP and the drops.
    gear:
      - Abyssal whip or better
      - Barrows or better body and legs
      - Slayer helmet (imbued if you have the points)
      - Ring of dueling or a house teleport for the return trip
    inventory:
      - Prayer potions
      - Super combat or overload
      - Food
      - Task-specific items — rock hammer, bag of salt, boots of stone
    notes: >-
      The rate depends heavily on which tasks are blocked and skipped, so treat it as an
      average over a well-managed block list rather than a per-task figure. The requirements
      above understate the real gate: these masters have combat level requirements this
      corpus does not model, and the rate assumes gear well past what `requires` checks.
    wiki_url: https://oldschool.runescape.wiki/w/Slayer

# No conservative default here: `pvm_support.yaml` already declares `slayer_conservative`,
# and §10.7 requires ids to be unique across every file of a kind. Adding a second floor would
# also be worse than redundant — §8.2 selects among the methods a player currently satisfies,
# so two unrequirement'd entries for one skill would make which floor applies depend on load
# order rather than on the account.
