# §8.1 for Ranged.
#
# Authored alongside `slayer.yaml` and for the same reason: the corpus gates PvM capabilities
# on Ranged levels and generates a band candidate for each, but described no way of getting
# them, so every Ranged band was estimated at §8.2's conservative default.
#
# Requirements are `skill:` leaves only, for `slayer.yaml`'s reason — the real gates on the
# faster methods are quests and diaries, and naming ids the corpus may not declare would fail
# §10.7's referential integrity rather than merely leaving a rate optimistic.
#
# `detail` is descriptive only and is never read by the scorer or the estimator.

- id: ranged_early
  name: Ranged — early training
  skill: ranged
  xp_per_hour: 20000
  level_range: {min: 1, max: 40}
  cost_per_hour_gp: 15000
  detail:
    location: Stronghold of Security, or any low-level dungeon with a safespot
    target: Whatever your current bow out-ranges — the safespot matters more than the monster.
    gear:
      - The best bow you can wield
      - Leather or studded body
    inventory:
      - Enough arrows to last the trip, or bronze arrows to pick back up
      - Food
    notes: >-
      Rates at this level are limited by arrow supply and by how long a safespot holds, not by
      damage. Buying arrows in bulk is usually the difference between the rate above and half
      of it.
    wiki_url: https://oldschool.runescape.wiki/w/Ranged

- id: ranged_cannon_slayer
  name: Ranged — cannon on Slayer tasks
  skill: ranged
  xp_per_hour: 60000
  level_range: {min: 40, max: 99}
  cost_per_hour_gp: 300000
  requires:
    skill: {ranged: 40}
  detail:
    location: Wherever the current Slayer assignment is, in a multi-combat area.
    target: >-
      Multi-combat assignments — the cannon does the work and the Ranged XP is a by-product of
      the same trip that gives the Slayer level.
    gear:
      - Any bow or crossbow you can wield
      - Whatever armour the assignment demands
    inventory:
      - Dwarf multicannon and cannonballs
      - Food
      - Task-specific items
    notes: >-
      The GP figure is almost entirely cannonballs and is the reason this method is not simply
      always correct — it buys speed with money, and §9.4's `cost_decay` is what decides
      whether that trade is worth making for a given account. Pairs with `slayer_mid_tasks`
      and `slayer_high_tasks`: it is the same trip counted twice.
    wiki_url: https://oldschool.runescape.wiki/w/Dwarf_multicannon

- id: ranged_chinning
  name: Ranged — chinning
  skill: ranged
  xp_per_hour: 200000
  level_range: {min: 70, max: 99}
  cost_per_hour_gp: 900000
  requires:
    all_of:
      - skill: {ranged: 70}
      - skill: {defence: 40}
  detail:
    location: Monkey Madness tunnels, or the Kourend Catacombs
    target: Maniacal monkeys, or any dense multi-combat stack.
    gear:
      - Void or Karil's
      - Necklace of anguish or amulet of fury
      - Archer ring or Ava's device
    inventory:
      - Red or black chinchompas
      - Prayer potions
      - Food
    notes: >-
      The fastest Ranged in the game and the most expensive by a wide margin. The quoted rate
      assumes a full stack every throw, so it is a ceiling on a good spot rather than an
      average. The real gate is a quest this corpus does not model; the levels above are only
      the part it can check.
    wiki_url: https://oldschool.runescape.wiki/w/Chinchompa

# No conservative default here: `melee.yaml` already declares `ranged_conservative`, and §10.7
# requires ids to be unique across every file of a kind. See the same note in `slayer.yaml` for
# why a second floor would be worse than merely redundant.
