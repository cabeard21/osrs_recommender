# §6.6's classification table, plus the two execution milestones of §10.3 and the
# separate freeze-logging practice milestone §6.6's blockquote mandates.
#
# `kind` is how a milestone is measured; `class` is how it ages. They are orthogonal,
# and only `class: execution` may declare practiced_by / practice_group.

# --- threshold: a thing that happened. Permanent; never ages. --------------
- id: first_wilderness_kill
  name: First Wilderness kill
  class: threshold
  kind: derived

- id: first_anti_pk
  name: First anti-PK
  class: threshold
  kind: derived

# §6.6 lists this among the self-attested set: the plugin cannot see that a freeze
# actually secured the log-out.
- id: successfully_freeze_log
  name: Successfully freeze log
  class: threshold
  kind: self_attested

- id: lms_wins_10
  name: 10 LMS wins
  class: threshold
  kind: derived
  threshold: 10

- id: lms_wins_100
  name: 100 LMS wins
  class: threshold
  kind: derived
  threshold: 100

# --- knowledge: understanding, once acquired. Never ages. -----------------
# §6.6 permits an informational staleness note on this class but forbids any readiness
# effect, so it declares no practice attributes.
- id: teleblock_understanding
  name: Teleblock understanding
  class: knowledge
  kind: self_attested

# --- execution: mechanical skill. Freshness decays (§6.6). ----------------
- id: comfortable_4_way_switches
  name: Comfortable 4-way switches
  class: execution
  kind: self_attested
  practice_group: nh_fundamentals
  practiced_by: [lms, nh_combat, wilderness_pvp]

- id: consistent_overhead_prayers
  name: Consistent overhead prayers
  class: execution
  kind: self_attested
  practice_group: nh_fundamentals
  practiced_by: [lms, nh_combat, wilderness_pvp, anti_pking]

# The separate practice milestone §6.6 requires: `successfully_freeze_log` above records
# that it happened and stays achieved forever; this one decays and drives refreshers.
# One row meaning both would make `achieved` ambiguous.
- id: freeze_logging_practice
  name: Freeze logging practice
  class: execution
  kind: self_attested
  practice_group: nh_fundamentals
  practiced_by: [lms, nh_combat, wilderness_pvp]

- id: vengeance_timing
  name: Vengeance timing
  class: execution
  kind: self_attested
  practice_group: vengeance_fundamentals
  practiced_by: [vengeance_pvp, wilderness_pvp]
