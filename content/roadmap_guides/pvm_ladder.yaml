      - {id: kalphite_queen, name: Kalphite Queen, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}, {skill: {defence: 70}}, {skill: {ranged: 70}}]}, mechanics: [Survive heavy damage while handling style changes, flinching, and adds.], rewards: [Dragon chainbody, Dragon pickaxe], wiki_url: https://oldschool.runescape.wiki/w/Kalphite_Queen}
      - {id: commander_zilyana_solo, name: Commander Zilyana (Solo), recommendations: {all_of: [{skill: {ranged: 85}}, {skill: {defence: 70}}, {skill: {agility: 70}}]}, mechanics: [Keep the kite cycle stable through minions and extended trips.], rewards: [Armadyl crossbow, Saradomin hilt], wiki_url: https://oldschool.runescape.wiki/w/Commander_Zilyana}
      - {id: kril_tsutsaroth_solo, name: K'ril Tsutsaroth (Solo), recommendations: {any_of: [{all_of: [{skill: {attack: 85}}, {skill: {strength: 85}}]}, {all_of: [{skill: {ranged: 85}}, {skill: {defence: 80}}]}]}, mechanics: [Maintain the attack cycle while kiting and cleaning up minions.], rewards: [Zamorakian hasta, Staff of the dead, Zamorak hilt], wiki_url: https://oldschool.runescape.wiki/w/K%27ril_Tsutsaroth}

  - id: elite
    name: Elite
    summary: Bring high combat stats and strong equipment to punishing solo bosses and raids.
    capability_id: dragon_bossing
    preparation:
      - {id: elite_dragon_slayer_ii, label: Complete Dragon Slayer II for Ava's assembler from Vorkath., completion: {quest: dragon_slayer_ii}, candidate_ids: [complete_dragon_slayer_ii]}
      - {id: elite_desert_treasure_ii, label: Complete Desert Treasure II., completion: {quest: desert_treasure_ii_the_fallen_empire}, candidate_ids: [complete_desert_treasure_ii_the_fallen_empire]}
      - {id: elite_beneath_cursed_sands, label: Complete Beneath Cursed Sands for Tombs of Amascut., completion: {quest: beneath_cursed_sands}, candidate_ids: [complete_beneath_cursed_sands]}
      - {id: elite_blood_moon_rises, label: Complete The Blood Moon Rises for Maggot King access., completion: {quest: the_blood_moon_rises}, candidate_ids: [complete_the_blood_moon_rises]}
      - {id: elite_prayer_scrolls, label: Unlock Rigour and Augury., completion: {all_of: [{unlock: rigour}, {unlock: augury}]}, candidate_ids: [unlock_rigour, unlock_augury]}
