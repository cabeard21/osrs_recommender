      - {id: araxxor, name: Araxxor, access: {skill: {slayer: 92}}, recommendations: {all_of: [{skill: {attack: 90}}, {skill: {strength: 90}}, {skill: {defence: 85}}]}, mechanics: [Read attack patterns, clear minions, and finish the enrage cleanly.], rewards: [Araxyte fang, Noxious halberd components], wiki_url: https://oldschool.runescape.wiki/w/Araxxor}
