      - {id: duke_sucellus, name: Duke Sucellus, access: {quest: desert_treasure_ii_the_fallen_empire}, recommendations: {all_of: [{skill: {attack: 75}}, {skill: {strength: 75}}, {skill: {defence: 70}}]}, mechanics: [Keep the attack cycle clean while respecting arena hazards.], rewards: [Magus ring, Eye of the duke], wiki_url: https://oldschool.runescape.wiki/w/Duke_Sucellus}
      - {id: maggot_king, name: Maggot King, access: {quest: the_blood_moon_rises}, recommendations: {all_of: [{any_of: [{skill: {magic: 85}}, {skill: {ranged: 85}}]}, {skill: {attack: 85}}, {skill: {strength: 85}}, {skill: {defence: 75}}]}, mechanics: [Combine style switches, prayer changes, positioning, and punish mechanics.], rewards: [Crimson kisten, Elder venator fang], wiki_url: https://oldschool.runescape.wiki/w/Maggot_King}
