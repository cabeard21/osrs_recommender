      - {id: demonic_gorillas, name: Demonic gorillas, access: {quest: monkey_madness_ii}, recommendations: {all_of: [{skill: {attack: 75}}, {skill: {strength: 75}}, {skill: {defence: 70}}, {skill: {ranged: 70}}]}, mechanics: [Swap styles and prayers in response to the gorilla's changes.], rewards: [Zenyte shard, Ballista components], wiki_url: https://oldschool.runescape.wiki/w/Demonic_gorilla}
