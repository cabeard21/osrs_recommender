id: pvm_bossing_ladder
name: PvM Bossing Ladder
roadmap_id: pvm_ladder
source:
  url: https://oldschool.runescape.wiki/w/Guide:Bossing_Ladder?oldid=15319480
  revision: 15319480
  checked_at: 2026-09-04
  license: CC BY-NC-SA 3.0
tiers:
  - id: easy
    name: Easy
    summary: Learn basic survival, movement, and prayer use while building an early quested account.
    capability_id: boss_fundamentals
    preparation:
      - id: easy_free_to_play_quests
        label: Use free-to-play quests to learn navigation, early combat, and basic boss mechanics.
      - id: easy_early_monsters
        label: Train on Lumbridge and Edgeville Dungeon monsters, then safespot chromatic dragons for early magic experience and loot.
      - id: easy_quest_combat_xp
        label: Prioritize quests that award combat experience for an early stat boost.
      - id: easy_rune_melee_setup
        label: Reach 40 Attack, Strength, and Defence, then pick up a Rune scimitar.
        completion:
          all_of:
            - skill: {attack: 40}
            - skill: {strength: 40}
            - skill: {defence: 40}
            - item: rune_scimitar
        candidate_ids:
          [train_attack_to_40, train_strength_to_40, train_defence_to_40, obtain_rune_scimitar]
      - id: easy_dragon_slayer
        label: Complete Dragon Slayer I for the anti-dragon shield.
        completion: {quest: dragon_slayer_i}
        candidate_ids: [complete_dragon_slayer_i]
      - id: easy_utility_quests
        label: Complete The Lost Tribe and Animal Magnetism for the Dorgeshuun crossbow and Ava's devices.
        completion: {all_of: [{quest: the_lost_tribe}, {quest: animal_magnetism}]}
        candidate_ids: [complete_the_lost_tribe, complete_animal_magnetism]
      - id: easy_overheads
        label: Reach 43 Prayer for overhead protection prayers as soon as possible.
        completion: {skill: {prayer: 43}}
        candidate_ids: [train_prayer_to_43]
    encounters:
      - {id: brutus, name: Brutus, access: {quest: the_ides_of_milk}, recommendations: {skill: {hitpoints: 20}}, mechanics: [Respond to special attacks.], rewards: [Mooleta, Bottomless milk bucket], wiki_url: https://oldschool.runescape.wiki/w/Brutus}
      - {id: wintertodt, name: Wintertodt, recommendations: {all_of: [{skill: {firemaking: 50}}, {skill: {woodcutting: 35}}]}, mechanics: [Manage positioning and keep the braziers and pyromancers working.], rewards: [Wintertodt rewards, Tome of fire], wiki_url: https://oldschool.runescape.wiki/w/Wintertodt}
      - {id: tempoross, name: Tempoross, recommendations: {skill: {fishing: 35}}, mechanics: [Handle environmental hazards during exposed damage windows.], rewards: [Tempoross rewards, Tome of water], wiki_url: https://oldschool.runescape.wiki/w/Tempoross}
      - {id: barrows, name: Barrows, access: {quest: priest_in_peril}, recommendations: {all_of: [{skill: {magic: 35}}, {skill: {prayer: 43}}]}, mechanics: [Use overhead prayers and navigate the crypts efficiently.], rewards: [Barrows equipment], wiki_url: https://oldschool.runescape.wiki/w/Barrows}
      - {id: obor_bryophyta, name: Obor & Bryophyta, recommendations: {all_of: [{skill: {attack: 40}}, {skill: {strength: 40}}, {skill: {defence: 40}}, {skill: {prayer: 43}}]}, mechanics: [Manage hitpoints and clear summoned minions.], rewards: [Hill giant club, Bryophyta's essence], wiki_url: https://oldschool.runescape.wiki/w/Obor}
      - {id: deranged_archaeologist, name: Deranged archaeologist, access: {quest: bone_voyage}, recommendations: {all_of: [{skill: {magic: 50}}, {skill: {prayer: 40}}]}, mechanics: [Recognize the dangerous book attack and move away.], rewards: [Steel ring], wiki_url: https://oldschool.runescape.wiki/w/Deranged_archaeologist}
      - {id: scurrius, name: Scurrius, recommendations: {all_of: [{skill: {prayer: 43}}, {any_of: [{all_of: [{skill: {attack: 40}}, {skill: {strength: 40}}, {skill: {defence: 40}}]}, {skill: {ranged: 40}}, {skill: {magic: 40}}]}]}, mechanics: [Handle minions, prayer switches, and movement together.], rewards: [Scurrius' spine], wiki_url: https://oldschool.runescape.wiki/w/Scurrius}

  - id: medium
    name: Medium
    summary: Broaden combat styles and unlock dependable dragon-tier, ranged, and magic equipment.
    capability_id: mid_tier_bossing
    preparation:
      - id: medium_dragon_melee
        label: Reach 65 Attack and Strength with 60 Defence for dragon melee gear and the Dragon defender.
        completion:
          all_of:
            - skill: {attack: 65}
            - skill: {strength: 65}
            - skill: {defence: 60}
            - item: dragon_defender
        candidate_ids:
          [train_attack_to_65, train_strength_to_65, train_defence_to_60, obtain_dragon_defender]
      - id: medium_ranged_setup
        label: Reach 61 Ranged and buy a Rune crossbow.
        completion: {all_of: [{skill: {ranged: 61}}, {item: rune_crossbow}]}
        candidate_ids: [train_ranged_to_61, buy_rune_crossbow]
      - id: medium_monkey_madness
        label: Complete Monkey Madness I and get a Dragon scimitar.
        completion: {all_of: [{quest: monkey_madness_i}, {item: dragon_scimitar}]}
        candidate_ids: [complete_monkey_madness_i, obtain_dragon_scimitar]
      - id: medium_heroes
        label: Complete Heroes' Quest for the Dragon mace.
        completion: {quest: heroes_quest}
        candidate_ids: [complete_heroes_quest]
      - id: medium_underground_pass
        label: Complete Underground Pass and claim Iban's staff.
        completion: {all_of: [{quest: underground_pass}, {item: ibans_staff_u}]}
        candidate_ids: [complete_underground_pass, obtain_ibans_staff]
      - id: medium_desert_treasure
        label: Complete Desert Treasure I for Ancient Magicks.
        completion: {all_of: [{quest: desert_treasure_i}, {unlock: ancient_magicks}]}
        candidate_ids: [complete_desert_treasure_i]
      - id: medium_fremennik_isles
        label: Complete The Fremennik Isles and equip the Helm of neitiznot.
        completion: {all_of: [{quest: the_fremennik_isles}, {item: helm_of_neitiznot}]}
        candidate_ids: [complete_the_fremennik_isles, obtain_helm_of_neitiznot]
      - id: medium_barrows_gloves
        label: Complete Recipe for Disaster and pick up Barrows gloves.
        completion: {all_of: [{quest: recipe_for_disaster}, {item: barrows_gloves}]}
        candidate_ids: [complete_recipe_for_disaster, obtain_barrows_gloves]
    encounters:
      - {id: shellbane_gryphon, name: Shellbane Gryphon, access: {all_of: [{quest: troubled_tortugans}, {skill: {slayer: 51}}]}, recommendations: {all_of: [{skill: {attack: 65}}, {skill: {strength: 65}}]}, mechanics: [Use movement to avoid special attacks.], rewards: [Belle's folly], wiki_url: https://oldschool.runescape.wiki/w/Shellbane_Gryphon}
      - {id: barbarian_assault, name: Barbarian Assault, recommendations: {all_of: [{skill: {attack: 40}}, {skill: {strength: 40}}, {skill: {defence: 40}}]}, mechanics: [Coordinate combat styles, role items, and team communication.], rewards: [Fighter torso], wiki_url: https://oldschool.runescape.wiki/w/Barbarian_Assault}
      - {id: amoxliatl, name: Amoxliatl, access: {quest: the_heart_of_darkness}, recommendations: {all_of: [{skill: {attack: 60}}, {skill: {strength: 60}}]}, mechanics: [Keep moving through special attacks.], rewards: [Glacial temotli, Pendant of Ates], wiki_url: https://oldschool.runescape.wiki/w/Amoxliatl}
      - {id: hueycoatl, name: The Hueycoatl, access: {quest: children_of_the_sun}, recommendations: {all_of: [{skill: {attack: 60}}, {skill: {strength: 60}}]}, mechanics: [Move with the encounter and switch protection prayers cleanly.], rewards: [Dragon hunter wand, Hueycoatl hide, Tome of earth], wiki_url: https://oldschool.runescape.wiki/w/The_Hueycoatl}
      - {id: hespori, name: Hespori, access: {skill: {farming: 65}}, recommendations: {all_of: [{skill: {attack: 60}}, {skill: {strength: 60}}]}, mechanics: [Handle special attacks and phase transitions.], rewards: [Anima seeds, Bottomless compost bucket], wiki_url: https://oldschool.runescape.wiki/w/Hespori}
      - {id: giant_mole, name: Giant Mole, recommendations: {any_of: [{all_of: [{skill: {attack: 60}}, {skill: {strength: 60}}]}, {skill: {magic: 60}}]}, mechanics: [Safespot and relocate when the mole burrows.], rewards: [Mole skin, Mole claw, Immaculate mole skin], wiki_url: https://oldschool.runescape.wiki/w/Giant_Mole}
      - {id: crazy_archaeologist_chaos_fanatic, name: Crazy archaeologist & Chaos Fanatic, recommendations: {all_of: [{skill: {magic: 50}}, {skill: {ranged: 65}}]}, mechanics: [Read dangerous attacks while managing Wilderness player risk.], rewards: [Malediction shards, Odium shards], wiki_url: https://oldschool.runescape.wiki/w/Crazy_archaeologist}
      - {id: kraken, name: Kraken, access: {skill: {slayer: 87}}, recommendations: {skill: {magic: 75}}, mechanics: [Manage hitpoints during a low-movement fight.], rewards: [Trident of the seas, Kraken tentacle], wiki_url: https://oldschool.runescape.wiki/w/Kraken}
      - {id: sarachnis, name: Sarachnis, recommendations: {all_of: [{skill: {attack: 60}}, {skill: {strength: 60}}, {skill: {defence: 60}}]}, mechanics: [Handle minions and prayer switches without losing position.], rewards: [Sarachnis cudgel, Giant egg sac, Pristine spider silk], wiki_url: https://oldschool.runescape.wiki/w/Sarachnis}
      - {id: king_black_dragon, name: King Black Dragon, recommendations: {any_of: [{all_of: [{skill: {attack: 65}}, {skill: {strength: 65}}]}, {skill: {ranged: 65}}]}, mechanics: [Mitigate dragonfire and plan for Wilderness risk.], rewards: [Dragon bones, Black dragonhide], wiki_url: https://oldschool.runescape.wiki/w/King_Black_Dragon}
      - {id: zalcano, name: Zalcano, access: {quest: song_of_the_elves}, mechanics: [Use positioning and react to environmental hazards while skilling.], rewards: [Crystal tool seed, Zalcano shard], wiki_url: https://oldschool.runescape.wiki/w/Zalcano}
      - {id: thermonuclear_smoke_devil, name: Thermonuclear smoke devil, access: {skill: {slayer: 93}}, recommendations: {all_of: [{skill: {attack: 85}}, {skill: {strength: 85}}]}, mechanics: [Manage hitpoints with flinching or Redemption setups.], rewards: [Occult necklace, Smoke battlestaff], wiki_url: https://oldschool.runescape.wiki/w/Thermonuclear_smoke_devil}
      - {id: mimic, name: The Mimic, recommendations: {any_of: [{all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}]}, {skill: {ranged: 70}}]}, mechanics: [Kite safely and deal with summoned minions.], rewards: [Elite and master clue reward caskets, Ring of 3rd age], wiki_url: https://oldschool.runescape.wiki/w/The_Mimic}
      - {id: royal_titans, name: Royal Titans, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}, {skill: {defence: 70}}, {skill: {ranged: 70}}, {skill: {magic: 75}}]}, mechanics: [Handle tribrid combat, arena hazards, and minions.], rewards: [Elemental crown pieces, Prayer upgrades], wiki_url: https://oldschool.runescape.wiki/w/Royal_Titans}
      - {id: moons_of_peril, name: Moons of Peril, access: {quest: perilous_moons}, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}, {skill: {defence: 70}}]}, mechanics: [Read attack patterns and use positioning to reduce damage.], rewards: [Moon armour sets], wiki_url: https://oldschool.runescape.wiki/w/Moons_of_Peril}
      - {id: mad_angel, name: Mad Angel, access: {quest: fallen_from_grace}, recommendations: {all_of: [{skill: {attack: 65}}, {skill: {strength: 65}}]}, mechanics: [React to special attacks, prayer switches, and positioning checks.], rewards: [Hallowfell, Granite dust], wiki_url: https://oldschool.runescape.wiki/w/Mad_Angel}
      - {id: god_wars_dungeon_teams, name: God Wars Dungeon bosses (Teams), recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}, {skill: {ranged: 70}}, {skill: {defence: 70}}, {skill: {hitpoints: 70}}, {skill: {agility: 70}}]}, mechanics: [Manage inventory, aggression, and repeated team kills.], rewards: [God Wars Dungeon uniques], wiki_url: https://oldschool.runescape.wiki/w/God_Wars_Dungeon}

  - id: hard
    name: Hard
    summary: Combine several mechanics reliably and unlock demanding Slayer and grandmaster-quest encounters.
    capability_id: gwd_bossing
    preparation:
      - {id: hard_fire_cape, label: Complete the Fight Caves and earn a Fire cape., completion: {item: fire_cape}, candidate_ids: [obtain_fire_cape]}
      - id: hard_arclight
        label: Collect ancient shards and assemble Arclight for demon-heavy encounters.
      - {id: hard_final_dawn, label: Complete The Final Dawn for the Arkan blade., completion: {quest: the_final_dawn}, candidate_ids: [complete_the_final_dawn]}
      - {id: hard_kingdom_divided, label: Complete A Kingdom Divided for Thralls., completion: {quest: a_kingdom_divided}, candidate_ids: [complete_a_kingdom_divided]}
      - {id: hard_song, label: Complete Song of the Elves for Prifddinas access., completion: {quest: song_of_the_elves}, candidate_ids: [complete_song_of_the_elves]}
      - {id: hard_monkey_madness_ii, label: Complete Monkey Madness II., completion: {quest: monkey_madness_ii}, candidate_ids: [complete_monkey_madness_ii]}
      - {id: hard_sins, label: Complete Sins of the Father., completion: {quest: sins_of_the_father}, candidate_ids: [complete_sins_of_the_father]}
      - {id: hard_wgs, label: Complete While Guthix Sleeps., completion: {quest: while_guthix_sleeps}, candidate_ids: [complete_while_guthix_sleeps]}
      - id: hard_titans_prayers
        label: Unlock Deadeye and Mystic vigour from Royal Titans when you are ready for the upgrade.
    encounters:
      - {id: scorpia, name: Scorpia, recommendations: {skill: {magic: 79}}, mechanics: [Freeze and kite while accounting for multi-combat Wilderness pressure.], rewards: [Odium shard 3, Malediction shard 3, Dragon 2h sword], wiki_url: https://oldschool.runescape.wiki/w/Scorpia}
      - {id: chaos_elemental, name: Chaos Elemental, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}]}, mechanics: [Use Wilderness-aware flinching setups around its disruption mechanics.], rewards: [Dragon pickaxe, Dragon 2h sword], wiki_url: https://oldschool.runescape.wiki/w/Chaos_Elemental}
      - {id: vetion_calvarion, name: Vet'ion and Calvar'ion, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}]}, mechanics: [Manage positioning and summoned minions in the Wilderness.], rewards: [Voidwaker blade, Dragon pickaxe], wiki_url: https://oldschool.runescape.wiki/w/Vet%27ion}
      - {id: venenatis_spindel, name: Venenatis and Spindel, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}]}, mechanics: [Learn attack patterns, Wilderness spacing, and spider adds.], rewards: [Voidwaker gem, Dragon pickaxe], wiki_url: https://oldschool.runescape.wiki/w/Venenatis}
      - {id: callisto_artio, name: Callisto and Artio, recommendations: {all_of: [{skill: {ranged: 70}}, {skill: {magic: 79}}]}, mechanics: [Combine prayer switches, freezing, and hazard avoidance.], rewards: [Voidwaker hilt, Dragon pickaxe], wiki_url: https://oldschool.runescape.wiki/w/Callisto}
      - {id: dagannoth_kings, name: Dagannoth Kings, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}, {skill: {ranged: 70}}, {skill: {magic: 60}}]}, mechanics: [Use multiple combat styles and control king positioning.], rewards: [Berserker ring, Archers ring, Seers ring, Dragon axe], wiki_url: https://oldschool.runescape.wiki/w/Dagannoth_Kings}
      - {id: grotesque_guardians, name: Grotesque Guardians, access: {all_of: [{quest: priest_in_peril}, {skill: {slayer: 75}}]}, recommendations: {all_of: [{skill: {attack: 70}}, {skill: {strength: 70}}, {skill: {defence: 70}}, {skill: {ranged: 70}}]}, mechanics: [Switch styles and dodge telegraphed mechanics cleanly.], rewards: [Granite dust, Granite hammer, Black tourmaline core], wiki_url: https://oldschool.runescape.wiki/w/Grotesque_Guardians}
      - {id: skotizo, name: Skotizo, recommendations: {all_of: [{skill: {attack: 75}}, {skill: {strength: 75}}, {skill: {defence: 70}}]}, mechanics: [Handle environmental mechanics and minions without losing tempo.], rewards: [Ancient shard], wiki_url: https://oldschool.runescape.wiki/w/Skotizo}
