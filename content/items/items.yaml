# The PvM ladder's gear. Every `item_id` below came from `tools/lookup_item_ids.py`, which
# reads the price API's own `/mapping` catalog and refuses to choose between near-identical
# names — the "(empty)", "(uncharged)" and "(c)" variants are how a plausible-looking wrong
# id gets committed, and a wrong id here is a silently wrong GP estimate rather than an error.
#
# There is no Toxic blowpipe entry for exactly that reason: only `Toxic blowpipe (empty)` has
# a catalog row, since the charged form is untradeable, and an `item:` leaf naming the empty
# id would miss every player who owns a charged one.
- id: rune_crossbow
