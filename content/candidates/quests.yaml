# §10.6 candidates of `kind: quest`.
#
# A quest candidate is where `advances` and `grants_facts` most obviously differ (§10.6).
# DT1 grants exactly two facts — the quest is complete, and Ancients are unlocked — but
# it *advances* three capabilities by very different amounts, because two of them need
# far more than Ancients before they are usable.

# §16.2's first pairwise judgment: "DT1 outranks buying a Voidwaker while Ancients are
# still locked." That must fall out of the derivations, not out of an authored priority —
# DT1's leverage is what carries it, since unlocking Ancients is what lets both
# ice_barrage_nh and train_magic_87_to_94 stop being blocked.
- id: complete_desert_treasure_i
  name: Complete Desert Treasure I
  kind: quest
  advances:
    ice_barrage_nh: 0.90
    deep_wildy_nh: 0.60
    budget_nh: 0.50
  # Skill *and* quest requirements. The quest half was omitted until Step 4 because
  # quests/ declared only the two quests the capabilities gate on, and §10.7 rejects a
  # `quest:` leaf naming an undeclared id. The generated registry now declares all 211,
  # so the constraint is gone — and while it stood, DT1 read as *available* to an account
  # that could not start it, which is the §4.5 error in the direction that costs a user
  # an afternoon.
  requires:
    all_of:
      - skill: {thieving: 53}
      - skill: {firemaking: 50}
      - skill: {magic: 50}
      - skill: {slayer: 10}
      - quest: the_dig_site
      - quest: temple_of_ikov
      - quest: the_tourist_trap
      - quest: troll_stronghold
      - quest: priest_in_peril
      - quest: waterfall_quest
      - quest: plague_city
  completion:
    quest: desert_treasure_i
  # Two facts, because the quest reward is the point: the unlock is what other content
  # gates on, and a `quest:` leaf alone would leave `leverage` unable to see it.
  grants_facts:
    all_of:
      - quest: desert_treasure_i
      - unlock: ancient_magicks

# Authored rather than generated, and the reason is the second fact it grants. Lunar
# Diplomacy gives the lunar spellbook, which `vengeance_pvp` gates on — but the
# quest→unlock mapping lives in the plugin's `QUEST_GRANTED_UNLOCKS` table, not in the
# wiki dump the generator reads, so no generated entry could ever know about it. A bare
# `quest:` leaf would leave `leverage` unable to see the unlock, exactly as noted on DT1.
#
# The weight is calibrated against DT1 above rather than a rule invented for it. A
# "fraction of leaves satisfied" rule would give 0.50 here — and 0.50 for DT1, where this
# corpus authored 0.90 — so leaf-counting is demonstrably not the convention: the enabling
# unlock counts for more than its share. The two cases are the same shape (four leaves;
# quest and enabling unlock satisfied; one skill level and one other thing left), so they
# carry the same number. If 0.90 is wrong here it is wrong there too.
- id: complete_lunar_diplomacy
  name: Complete Lunar Diplomacy
  kind: quest
  source: authored
  advances:
    vengeance_pvp: 0.90
  requires:
    all_of:
      - skill: {crafting: 61}
      - skill: {defence: 40}
      - skill: {firemaking: 49}
      - skill: {herblore: 5}
      - skill: {magic: 65}
      - skill: {mining: 60}
      - skill: {woodcutting: 55}
      - quest: the_fremennik_trials
      - quest: lost_city
      - quest: rune_mysteries
      - quest: shilo_village
  completion:
    quest: lunar_diplomacy
  grants_facts:
    all_of:
      - quest: lunar_diplomacy
      - unlock: spellbook_lunar

# ---------------------------------------------------------------------------
# The PvM ladder's two weighted quests
# ---------------------------------------------------------------------------
#
# Both were generated until the ladder existed, and both are promoted here for the one
# reason `docs/proposals/advances-weights.md` allows: **a quest may carry an `advances`
# weight only where some capability gates on it.** The ladder gates on five quests; three of
# them — Priest in Peril, Troll Stronghold, Death Plateau — stay generated and unweighted,
# because weighting a prerequisite is §5's option (a), "inventing an ordering the derivations
# should produce".
#
# The entries below are copied verbatim out of `content/candidates/generated/quests.yaml`
# with `source` flipped and `advances` added. The `completion` blocks are byte-identical on
# purpose: `generate_candidates.py` skips an authored quest by matching
# `completion: {quest: <id>}`, not by matching the candidate id, so an edit here would
# resurrect a generated twin. Nothing was added under `content/quests/` either — the registry
# stays wholly generated, and an authored file there would drop the row every `quest:` leaf
# naming these ids resolves against.

# Rung 1's only quest gate, and the smaller of the two weights. `boss_fundamentals` is mostly
# combat levels, so the quest is a genuinely smaller fraction of that rung than DT1 is of
# `ice_barrage_nh` — the leaf-count intuition and the DT1 anchor agree here, which is why
# this one is not also 0.90.
- id: complete_dragon_slayer_i
  name: Complete Dragon Slayer I
  kind: quest
  source: authored
  advances:
    boss_fundamentals: 0.60
  requires:
    quest_points: 32
  completion:
    quest: dragon_slayer_i
  grants_facts:
    quest: dragon_slayer_i

# Structurally the DT1 case: the sole quest gate on its rung, with a small residual left
# afterwards. 0.85 rather than DT1's 0.90 because `dragon_bossing`'s residual is larger — a
# Dragon hunter crossbow and Ranged 80, against DT1's one item and one skill. 0.40 on
# `raid_ready` because that rung is two steps further on and DS2 clears only its floor.
- id: complete_dragon_slayer_ii
  name: Complete Dragon Slayer II
  kind: quest
  source: authored
  advances:
    dragon_bossing: 0.85
    raid_ready: 0.40
  requires:
    all_of:
      - skill: {agility: 60}
      - skill: {construction: 50}
      - skill: {crafting: 62}
      - skill: {hitpoints: 50}
      - skill: {magic: 75}
      - skill: {mining: 68}
      - skill: {smithing: 70}
      - skill: {thieving: 60}
      - quest_points: 200
      - quest: legends_quest
      - quest: dream_mentor
      - quest: a_tail_of_two_cats
      - quest: animal_magnetism
      - quest: ghosts_ahoy
      - quest: bone_voyage
      - quest: client_of_kourend
      - quest: barbarian_training
  completion:
    quest: dragon_slayer_ii
  grants_facts:
    quest: dragon_slayer_ii
