# §10.6 candidates of `kind: unlock`.
#
# `unlock:` keys are an open set (§6.3) — no registry to declare them in, which is why
# these need no matching file elsewhere in the corpus.
#
# **Why these completion predicates carry skill leaves as well as the unlock.** For every
# kind but skill_training, `proximity` is the unlock_fraction of `completion` (§10.6). A
# completion of one `unlock:` leaf therefore only ever reads 0 or 1, and the candidate
# looks equally distant at 24 Prayer and at 1. Naming the levels the unlock actually
# depends on is not padding: it is what gives a non-numeric candidate a progress signal,
# and it stays true as a completion predicate — you are not done until both hold.

# §16.2's third pairwise judgment pairs this against unlock_rigour for an account below
# 25 Prayer. Protect Item is what makes early Wilderness practice affordable, so it
# advances the cheap capability most; Rigour is a late, expensive damage upgrade.
- id: unlock_protect_item
  name: Unlock Protect Item
  kind: unlock
  advances:
    budget_nh: 0.60
    deep_wildy_nh: 0.35
    anti_pk: 0.30
  completion:
    all_of:
      - skill: {prayer: 25}
      - unlock: protect_item
  grants_facts:
    unlock: protect_item

# No `requires` gate. Rigour's real gate is a Dexterous prayer scroll, which is an item
# this corpus does not declare and a raid this app does not model; the 74 Prayer and 70
# Defence it also needs are progress toward it, not a barrier to starting, so they belong
# in `completion`. Add the scroll to items/ and move it here if that ever changes.
- id: unlock_rigour
  name: Unlock Rigour
  kind: unlock
  advances:
    deep_wildy_nh: 0.30
    anti_pk: 0.40
    budget_nh: 0.15
  completion:
    all_of:
      - skill: {prayer: 74}
      - skill: {defence: 70}
      - unlock: rigour
  grants_facts:
    unlock: rigour
