# §10.6 candidates of `kind: acquisition`.
#
# An acquisition's `completion` names items rather than levels, so `proximity` falls back
# to the completion predicate's unlock_fraction (§6.9) — the same machinery, no numeric
# target required (§10.6). That also makes the §4.5 rule visible in the ranking: with no
# ContainerScan ever recorded, `item:` leaves evaluate `unknown`, so an acquisition is
# neither complete nor blocked — it is unknown, and the app asks for a sync.
#
# No price is authored here. §8.3 prices these from the `item:` leaves through the OSRS
# Wiki feed, with items/items.yaml's fallback_price_gp as the last layer of the cascade.
#
# Every acquisition gates on `account_type`. Buying is not merely expensive for an ironman,
# it is impossible — the Grand Exchange is closed to them — so this is a `requires`, not a
# cost. `any_of` over main and group because a GIM can trade within their group.
#
# Until the account answers in Settings the leaf is `unknown`, which does **not** block
# (§10.6, G3): a main who never visited Settings keeps seeing these, and an ironman who
# answers once stops being told to buy things. Defaulting to "main" instead would assert
# the very fact whose absence is the bug.

# The single best spec weapon for the capabilities this corpus weights: it satisfies the
# `any_of` in both deep_wildy_nh and anti_pk. Note the two `advances` entries are a
# deliberate test of D11's "maximum, never sum" — summed they exceed 1.0, and pvp_value
# must still land at the larger single term.
- id: buy_voidwaker
  name: Buy a Voidwaker
  kind: acquisition
  advances:
    deep_wildy_nh: 0.80
    anti_pk: 0.60
  requires:
    any_of:
      - account_type: main
      - account_type: group
  completion:
    item: voidwaker
  grants_facts:
    item: voidwaker

# The expensive alternative, kept separate from buy_voidwaker so §16.2's cost invariant
# has something to bite on: an AGS-plus-Ahrim's setup advances deep Wilderness NH less
# than a Voidwaker does and costs more in aggregate, so it must not outrank it.
#
# `all_of` rather than `any_of`: a gear *set* is complete only when every piece is owned.
- id: buy_high_risk_gear
  name: Buy a high-risk NH setup
  kind: acquisition
  advances:
    deep_wildy_nh: 0.50
    anti_pk: 0.35
  requires:
    any_of:
      - account_type: main
      - account_type: group
  completion:
    all_of:
      - item: armadyl_godsword
      - item: ahrims_robetop
  grants_facts:
    all_of:
      - item: armadyl_godsword
      - item: ahrims_robetop

# ---------------------------------------------------------------------------
# The PvM ladder's gear
# ---------------------------------------------------------------------------
#
# These are not polish. `pvp_value` is `effective_capability_weight × advances`, and every
# one of the ~270 *generated* candidates carries `advances: {}` — so under `pvm_ladder` they
# all score at the ε floor and the ranked list would be skill bands plus alphabetical quest
# noise. The bands are real next actions (they end exactly at the rungs' gates, which is why
# the ladder's `skill:` leaves were designed first), but the two weighted quests both start
# blocked. Without the three entries below, the roadmap's list has nothing weighted in it on
# day one.
#
# Same `account_type` gate as above, for the same reason.

# The cheapest rung-2 gate, and by a wide margin the cheapest thing on this list — which is
# the point: it is what `cost_decay` should reward when the player is still at the bottom.
- id: buy_rune_crossbow
  name: Buy a Rune crossbow
  kind: acquisition
  advances:
    mid_tier_bossing: 1.00
  requires:
    any_of:
      - account_type: main
      - account_type: group
  completion:
    item: rune_crossbow
  grants_facts:
    item: rune_crossbow

# `any_of` in the completion, mirroring `gwd_bossing`'s own gate: Bandos and Armadyl are the
# melee and ranged answers to the same question, and owning either finishes this.
- id: buy_gwd_body_armour
  name: Buy God Wars body armour
  kind: acquisition
  advances: {}
  requires:
    any_of:
      - account_type: main
      - account_type: group
  completion:
    any_of:
      - item: bandos_chestplate
      - item: armadyl_chestplate
  grants_facts:
    any_of:
      - item: bandos_chestplate
      - item: armadyl_chestplate

# The ladder's one indispensable purchase — `dragon_bossing` gates on this item by name, so
# there is no `any_of` to soften it. Weighted against `raid_ready` too, and lower, for the
# same two-rungs-away reason `complete_dragon_slayer_ii` is.
- id: buy_dragon_hunter_crossbow
  name: Buy a Dragon hunter crossbow
  kind: acquisition
  advances: {}
  requires:
    any_of:
      - account_type: main
      - account_type: group
  completion:
    item: dragon_hunter_crossbow
  grants_facts:
    item: dragon_hunter_crossbow

