# §9.7. These are tuning knobs, not game facts, and §10.8 puts them in content so a
# retune is not a code change.
#
# The weights are **provisional priors, not tuned values** (§9.4). Step 13 tunes them
# against the golden corpus and sets tuned_against_corpus; until then it stays null so
# nobody mistakes these for measured numbers.
scoring_profile:
  version: 1
  tuned_against_corpus: null
  tau_hours: 10
  kappa_gp: {high: 8000000, normal: 20000000, low: 50000000}
  observation_aged_days: 14
  weights:
    pvp_value: 1.0
    leverage: 0.8
    proximity: 0.6
    effort_decay: 0.7
    cost_decay: 0.5
  refresher:
    max_in_primary_list: 1
    breadth_bonus_per_extra_member: 0.03
    breadth_bonus_cap: 0.10
