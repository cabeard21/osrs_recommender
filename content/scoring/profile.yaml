# §9.7. These are tuning knobs, not game facts, and §10.8 puts them in content so a
# retune is not a code change.
#
# These weights are **tuned**, not provisional (§16.3). They agree with 52/52 of the
# pairwise judgments in the corpus named by tuned_against_corpus. Every disagreement the
# search surfaced was reviewed by hand (§16.3 step 5) and its ruling recorded in
# docs/TUNING.md — seven judgments were withdrawn as wrong, and one modelling gap became
# A30's method_unlock factor rather than being absorbed into a weight.
scoring_profile:
  version: 2
  tuned_against_corpus: b978d44
  tau_hours: 10
  kappa_gp: {high: 8000000, normal: 20000000, low: 50000000}
  observation_aged_days: 14
  # What effort_decay charges a candidate §8 cannot size — a quest, whose duration the
  # SDD authors nowhere. Without it, hours=None reads as 0 and exp(0) = 1.0 hands the
  # least-known candidate a perfect effort mark (A8's defect, one candidate kind over).
  # Equal to tau_hours by default, so an unsized candidate is charged exactly one effort
  # scale: exp(−1) ≈ 0.37. The GP half is charged one κ, which kappa_gp already authors.
  unknown_effort_hours: 10
  weights:
    pvp_value: 1.0
    leverage: 0.8
    proximity: 0.6
    effort_decay: 0.7
    cost_decay: 0.5
    # A30's sixth factor, live in v2. 0.1 is the low end of a broad plateau — every value
    # in [0.1, 1.0] agrees with all 52 judgments — which is why it is preferred over the
    # knife-edge effort_decay: 0.8 that reaches the same 52/52 (0.9 breaks scenario 18).
    # Deliberately small: the factor only needs to break the scenario-10 tie it was built
    # to explain, not to outweigh the relevance factors. See D4 in docs/TUNING.md, which
    # also records why the search proposes 0.0 here — its tie-break prefers the shipped
    # profile, and a newly added factor is 0.0 in the shipped profile by construction.
    method_unlock: 0.1
  # §9.8's list is a list, not a dump. Uncapped was harmless at eight candidates and stops
  # being harmless once generated content puts hundreds in the corpus. Applied after
  # hysteresis and the refresher policy, so it only ever cuts the tail.
  max_primary_entries: 12
  refresher:
    max_in_primary_list: 1
    breadth_bonus_per_extra_member: 0.03
    breadth_bonus_cap: 0.10
