# Rung 3 of the PvM bossing ladder — see boss_fundamentals.yaml for the design note.
#
# Agility 70 and the two Troll quests are the God Wars Dungeon entrance itself; the rest is
# what surviving its multi-combat rooms costs. `any_of` on the chestplate because Bandos and
# Armadyl are the melee and ranged answers to the same question, and a corpus that demanded
# both would gate the rung on a style the player is not using.
id: gwd_bossing
name: God Wars Dungeon bossing
recommended_readiness: high
pvp_value: 0.80
requires:
  all_of:
    - capability: mid_tier_bossing
    - skill: {agility: 70}
    - skill: {strength: 70}
    - skill: {hitpoints: 75}
    - skill: {prayer: 70}
    - quest: troll_stronghold
    - quest: death_plateau
    - any_of:
        - item: bandos_chestplate
        - item: armadyl_chestplate
