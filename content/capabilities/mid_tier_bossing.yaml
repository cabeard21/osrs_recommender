# Rung 2 of the PvM bossing ladder — see boss_fundamentals.yaml for the design note.
#
# Slayer 55 rather than a boss name: the mid-tier bosses this rung stands for are reached
# through Slayer assignments, and a level is a fact the plugin reports where a kill count is
# not. The corpus prefers the fact it can observe over the one it would have to guess.
#
# Gated on the Rune crossbow alone, and not on `any_of: [rune_crossbow, toxic_blowpipe]` as
# the obvious alternative. `tools/lookup_item_ids.py` found that only `Toxic blowpipe (empty)`
# has a price-API catalog row — the charged form is untradeable — so an `item:` leaf naming it
# would miss every player who owns a charged one, and §8.3 could not price it either way.
id: mid_tier_bossing
name: Mid-tier bossing
recommended_readiness: medium
pvp_value: 0.70
requires:
  all_of:
    - capability: boss_fundamentals
    - skill: {slayer: 55}
    - skill: {ranged: 70}
    - skill: {defence: 70}
    - quest: priest_in_peril
    - unlock: ca_medium
    - item: rune_crossbow
