# Rung 4 of the PvM bossing ladder — see boss_fundamentals.yaml for the design note.
#
# The one rung gated on a single named item. Vorkath and the rest of the dragon tier are
# where the Dragon hunter crossbow stops being an upgrade and starts being the method, which
# is also why `buy_dragon_hunter_crossbow` in content/candidates/acquisitions.yaml carries a
# weight against this capability rather than against the ladder generally.
id: dragon_bossing
name: Vorkath and dragon bossing
recommended_readiness: high
pvp_value: 0.90
requires:
  all_of:
    - capability: gwd_bossing
    - skill: {ranged: 80}
    - skill: {prayer: 74}      # Rigour/Piety territory, and the last Prayer gate on the ladder
    - quest: dragon_slayer_ii
    - unlock: ca_hard
    - item: dragon_hunter_crossbow
