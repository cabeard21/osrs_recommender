name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run the full Python and browser coverage suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy tracker
      - run: python -m tracker.content.validate
      - run: python tools/generate_quest_cape.py --check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: make test-smoke PY=python

  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.full_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      # Reuse frozen searches across modules and start expensive scenarios first.
      # Playwright's session-scoped sync loop cannot share a worker with AnyIO tests.
      - run: >-
          make test-cov PY=python
          ARGS="-n 2 --dist=loadgroup --no-loadscope-reorder --durations=25 -m 'not browser and not llm_live' --cov-fail-under=0"
      - run: >-
          make test-cov PY=python
          ARGS="-m 'browser and not llm_live' --cov-append --durations=25"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/gear/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend/gear

  # Preserve the existing aggregate status for branch protection and publication.
  validate:
    if: always()
    needs: [checks, tests, frontend, coverage]
    runs-on: ubuntu-latest
    steps:
      - run: >-
          test '${{ needs.checks.result }}' = success &&
          test '${{ needs.tests.result }}' = success &&
          test '${{ needs.frontend.result }}' = success &&
          (test '${{ needs.coverage.result }}' = success ||
          test '${{ needs.coverage.result }}' = skipped)

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: osrs-recommender:test
          cache-from: type=gha,scope=osrs-recommender
          cache-to: type=gha,scope=osrs-recommender,mode=max
      - run: >-
          docker run --rm --entrypoint python osrs-recommender:test
          -c 'from tracker.api.contract import sync_payload_validator;
          sync_payload_validator()'
      - run: python3 tools/container_smoke.py osrs-recommender:test

  publish:
    # An explicit status check permits skipped optional ancestors; keep both gates mandatory.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.validate.result == 'success' && needs.container-smoke.result == 'success'
    needs: [validate, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=osrs-recommender
          cache-to: type=gha,scope=osrs-recommender,mode=max
