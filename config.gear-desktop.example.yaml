# Copy to config.gear-desktop.yaml (private and gitignored).
# Environment variables TRACKER_DESKTOP_<KEY> override these settings.
# For access from other tailnet devices, set this to the dev PC's `tailscale ip -4`.
bind_address: 127.0.0.1
port: 8502
content_dir: content
# Single Auto searches melee, ranged and magic in desktop worker processes.
# Set to 1 for serial execution, or 2 to reduce process memory use.
optimization_workers: 3

# Use the Pi's private Tailscale address. No database file is mounted or copied.
pi_url: http://100.117.157.57:8502
# Set the numeric player.id from the Pi database, not the RuneScape display name.
player_id: 1
# Match TRACKER_GEAR_DATA_TOKEN on the Pi; this is separate from the RuneLite token.
read_token: CHANGE_ME
