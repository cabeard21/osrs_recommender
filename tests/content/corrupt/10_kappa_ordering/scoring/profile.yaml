  version: 1
  tuned_against_corpus: null
  tau_hours: 10
  kappa_gp: {high: 50000000, normal: 20000000, low: 8000000}
  observation_aged_days: 14
  weights:
    pvp_value: 1.0
    leverage: 0.8
    proximity: 0.6
    effort_decay: 0.7
    cost_decay: 0.5
