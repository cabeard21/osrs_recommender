# **§16.2's second named pairwise judgment lives here.**
#
#   "94 Magic outranks 99 Strength when the target capability requires Barrage."
#
# The target capability is ice_barrage_nh, which main_nh weights at 1.00 and which requires
# 94 Magic. DT1 is complete and Ancients are unlocked, so `train_magic_87_to_94` is
# actionable and the fast method (magic_bursting, 250k/hr) is available to size it.
id: barrage_target
title: Ancients unlocked, Barrage is the target
notes: >
  The pair §16.2 states directly. Both are pure skill grinds, so nothing but relevance,
  distance and effort separates them — which is exactly the comparison the judgment is
  about.
player:
  synced: true
  combat_level: 112
  quest_points: 124
  gp_sensitivity: normal
  skills:
    attack: 80
    strength: 88
    defence: 75
    magic: 87
    prayer: 52
    ranged: 85
    hitpoints: 92
    thieving: 60
    firemaking: 55
    slayer: 62
    woodcutting: 60
  unlocks: {ancient_magicks: unlocked, protect_item: unlocked, rigour: locked, spellbook_lunar: locked}
  quests: {desert_treasure_i: complete, lunar_diplomacy: not_started}
  items: [mystic_robe_top]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: true}
    - {id: teleblock_understanding, achieved: true}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 3}
    - {id: consistent_overhead_prayers, achieved: true, practiced_days_ago: 3}
    - {id: freeze_logging_practice, achieved: true, practiced_days_ago: 3}
roadmaps: {main_nh: 1.0}
judgments:
  must_rank_above:
    - pair: [train_magic_87_to_94, train_strength_to_99]
      because: >
        §16.2, judgment 2. ice_barrage_nh is the top-weighted capability and requires 94
        Magic; 99 Strength advances only deep_wildy_nh (0.20) and anti_pk (0.25) and is an
        order of magnitude more work.
    - pair: [train_magic_87_to_94, buy_voidwaker]
      because: >
        7 Magic levels on the fast method is a few hours; the Voidwaker is 85M and does not
        unlock the capability the roadmap weights highest.
    - pair: [train_magic_87_to_94, train_woodcutting]
      because: Woodcutting advances nothing.
    - pair: [buy_voidwaker, train_woodcutting]
      because: Woodcutting advances nothing.
  top_3_contains:
    - id: train_magic_87_to_94
      because: The last gate on the highest-weighted capability.
  must_not_be_top:
    - id: train_strength_to_99
      because: §16.2, judgment 2, stated as an absolute.
    - id: train_woodcutting
      because: Advances nothing.
