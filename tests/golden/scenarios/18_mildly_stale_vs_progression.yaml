# One milestone 40 days stale — just inside `stale` (30–90d), so urgency is near the band's
# 0.40 floor — on an account with real progression still available (Ancients locked, DT1
# open).
#
# This is the scenario that keeps the refresher machinery honest at the *low* end. G10 caps
# refreshers at one in the primary list, and §16.2's invariant forbids a refresher winning
# on group size — but neither says anything about a single, mildly decayed mechanic losing
# to a quest that unlocks three capabilities. That is a judgment, and it belongs here.
id: mildly_stale_vs_progression
title: One mechanic 40 days stale, real progression outstanding
notes: >
  Together with `08_all_stale` this brackets the refresher's proper range: at 200 days and
  nothing else to do it should win; at 40 days with Ancients still locked it should not.
  A tuner that satisfies one and not the other has found a weight vector that cannot
  distinguish urgent from routine.
player:
  synced: true
  combat_level: 108
  quest_points: 121
  gp_sensitivity: normal
  skills:
    attack: 80
    strength: 88
    defence: 75
    magic: 87
    prayer: 52
    ranged: 85
    hitpoints: 90
    thieving: 60
    firemaking: 55
    slayer: 62
    woodcutting: 60
  unlocks:
    ancient_magicks: locked
    protect_item: unlocked
    rigour: locked
    spellbook_lunar: locked
  quests: {desert_treasure_i: not_started, lunar_diplomacy: not_started}
  items: [mystic_robe_top]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: true}
    - {id: teleblock_understanding, achieved: true}
    - {id: successfully_freeze_log, achieved: true}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 40}
    - {id: consistent_overhead_prayers, achieved: true, practiced_days_ago: 2}
    - {id: freeze_logging_practice, achieved: true, practiced_days_ago: 2}
roadmaps: {main_nh: 1.0}
judgments:
  must_rank_above:
    - pair: [complete_desert_treasure_i, refresh_nh_fundamentals]
      because: >
        One mechanic six weeks cold is a nudge; Ancients still being locked is the account's
        binding constraint. §9.8's refreshers are maintenance, and maintenance does not
        outrank the critical path.
    - pair: [refresh_nh_fundamentals, train_woodcutting]
      because: >
        A half-hour session that restores a real mechanic still beats a candidate advancing
        nothing — the refresher must lose to progression, not to everything.
    - pair: [complete_desert_treasure_i, buy_voidwaker]
      because: §16.2's first judgment; Ancients are locked.
  must_not_be_top:
    - id: refresh_nh_fundamentals
      because: The absolute form of the first pair above.
    - id: train_woodcutting
      because: Advances nothing.
