# `16_near_barrage` with an incumbent: the previous run's top entry was `buy_voidwaker`.
#
# §9.9 displaces an incumbent only when `challenger.score > 1.10 × incumbent.score`, on raw
# scores. At 93 Magic the Magic candidate should clear that margin comfortably — one level
# of bursting against an 85M purchase is not a near-tie — so hysteresis must *not* protect
# the incumbent here.
#
# That is the judgment worth recording. The boundary case (exactly 1.10×, displacement
# requires strictly more) is a unit test and lives in `tests/recommendations/`; a golden
# scenario asserting it would be asserting an exact score, which §16.1 forbids. What belongs
# in the corpus is the coaching consequence: anti-thrash must not become anti-progress.
id: incumbent_hysteresis
title: A stale incumbent must not survive a decisively better challenger
notes: >
  The only scenario in the corpus with an `incumbent`. Its judgments are the same as 16's —
  which is the assertion: supplying the previous top entry changes nothing when the
  challenger is clearly better. A hysteresis implementation that defended the incumbent
  unconditionally, or that compared log scores instead of raw ones (A15), would pass 16 and
  fail here.
