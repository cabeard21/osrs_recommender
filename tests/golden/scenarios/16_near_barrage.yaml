# 93 Magic: one level from Barrage, with Ancients and DT1 already done. `proximity` for
# `train_magic_87_to_94` is near 1 and the fast method sizes the remainder in well under an
# hour.
#
# Paired with `17_far_from_barrage` (75 Magic, everything else identical). The two together
# are the corpus's proximity probe: the same candidate, the same relevance, the same
# leverage, differing only in how much work is left. §16.2's invariant "of two otherwise
# identical candidates, the closer one ranks higher" is tested in
# `tests/recommendations/test_invariants.py`; what these two add is that the *ranking
# against other candidates* moves in the right direction as distance grows.
id: near_barrage
title: One Magic level from Ice Barrage
notes: >
  The account where the highest-value action is also the cheapest. If anything outranks
  finishing 93 → 94 Magic here, proximity and effort are both under-weighted.
player:
  synced: true
  combat_level: 114
  quest_points: 124
  gp_sensitivity: normal
  skills:
    attack: 80
    strength: 88
    defence: 75
    magic: 93
    prayer: 52
    ranged: 85
    hitpoints: 92
    thieving: 60
    firemaking: 55
    slayer: 62
    woodcutting: 60
  unlocks:
    ancient_magicks: unlocked
    protect_item: unlocked
    rigour: locked
    spellbook_lunar: locked
  quests: {desert_treasure_i: complete, lunar_diplomacy: not_started}
  items: [mystic_robe_top]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: true}
    - {id: teleblock_understanding, achieved: true}
    - {id: successfully_freeze_log, achieved: true}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 3}
    - {id: consistent_overhead_prayers, achieved: true, practiced_days_ago: 3}
    - {id: freeze_logging_practice, achieved: true, practiced_days_ago: 3}
roadmaps: {main_nh: 1.0}
judgments:
  must_rank_above:
    - pair: [train_magic_87_to_94, buy_voidwaker]
      because: >
        Under an hour of bursting completes the top-weighted capability's last gate; 85M
        does not. The clearest proximity/effort judgment in the corpus.
    - pair: [train_magic_87_to_94, train_strength_to_99]
      because: §16.2's second judgment, at its widest margin.
    - pair: [train_magic_87_to_94, unlock_rigour]
      because: One level against 22 Prayer levels and a raid drop.
    - pair: [train_magic_87_to_94, train_woodcutting]
      because: Woodcutting advances nothing.
  top_3_contains:
    - id: train_magic_87_to_94
      because: Nothing else is this close to this valuable.
  must_not_be_top:
    - id: train_woodcutting
      because: Advances nothing.
    - id: unlock_rigour
      because: 52 Prayer, 75 Defence — far, and behind unmodelled content.
