# A PvMer who wants to survive being attacked, not to go PKing: anti_pk alone at 1.00.
# Under that selection deep_wildy_nh drops to 0.30 and anti_pk itself rises to 1.00, which
# is the only place in the corpus where the melee-facing candidates get their best case.
#
# The account has 75 Defence and an AGS, so `anti_pk` is one milestone away rather than
# several levels away — the state where Rigour is genuinely the sensible next upgrade, and
# the counter-example that keeps `05_low_prayer_protect_item` from being read as
# "Rigour always loses".
id: anti_pk_focus
title: Anti-PK roadmap only, 70 Prayer, AGS owned
notes: >
  The mirror of 05. Same two unlock candidates, opposite verdict, because the account is
  now above Protect Item's threshold (it already has it) and within reach of Rigour's.
  A judgment corpus that only ever ranks Protect Item first would be fitting the engine to
  one account.
player:
  synced: true
  combat_level: 122
  quest_points: 160
  gp_sensitivity: normal
  skills:
    attack: 90
    strength: 92
    defence: 75
    magic: 82
    prayer: 70
    ranged: 90
    hitpoints: 96
    thieving: 60
    firemaking: 55
    slayer: 75
    woodcutting: 65
  unlocks:
    ancient_magicks: locked
    protect_item: unlocked
    rigour: locked
    spellbook_lunar: locked
  quests: {desert_treasure_i: not_started, lunar_diplomacy: not_started}
  items: [armadyl_godsword]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: true}
    - {id: first_anti_pk, achieved: true}
    - {id: teleblock_understanding, achieved: true}
    - {id: consistent_overhead_prayers, achieved: true, practiced_days_ago: 7}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 7}
roadmaps: {anti_pk: 1.0}
judgments:
  must_rank_above:
    - pair: [unlock_rigour, train_woodcutting]
      because: Woodcutting advances nothing under any roadmap.
    - pair: [unlock_rigour, train_strength_to_99]
      because: >
        At 92 Strength the last seven levels are the corpus's most expensive hours and
        advance anti_pk by 0.25; Rigour advances it by 0.40 and is four Prayer levels away.
    - pair: [complete_desert_treasure_i, train_woodcutting]
      because: Woodcutting advances nothing.
  must_not_be_top:
    - id: train_woodcutting
      because: Advances nothing.
    - id: train_strength_to_99
      because: >
        Seven levels at the top of the curve is the least efficient action available to this
        account.
