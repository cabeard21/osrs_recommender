# The mid-game main the plan names: most of the account is built, the spellbook is not.
# Magic is already 87 — the band `train_magic_87_to_94` covers — but that candidate gates on
# `unlock: ancient_magicks` and is therefore blocked, so the actionable list is the quest,
# the two acquisitions and the two unlocks.
id: midgame_main
title: Mid-game main, 87 Magic, Ancients locked
notes: >
  The most common real state for this app's user: a main with the levels but not the
  unlock. Every judgment here says the same thing in different words — clear the gate
  before buying gear for what is behind it.
player:
  synced: true
  combat_level: 108
  quest_points: 121
  gp_sensitivity: normal
  skills:
    attack: 80
    strength: 88
    defence: 75
    magic: 87
    prayer: 52
    ranged: 85
    hitpoints: 90
    thieving: 60
    firemaking: 55
    slayer: 62
    woodcutting: 60
  unlocks: {ancient_magicks: locked, protect_item: unlocked, rigour: locked, spellbook_lunar: locked}
  quests: {desert_treasure_i: not_started, lunar_diplomacy: not_started}
  items: [mystic_robe_top]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: true}
    - {id: teleblock_understanding, achieved: true}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 4}
    - {id: consistent_overhead_prayers, achieved: true, practiced_days_ago: 4}
    - {id: freeze_logging_practice, achieved: true, practiced_days_ago: 4}
roadmaps: {main_nh: 1.0}
judgments:
  must_rank_above:
    - pair: [complete_desert_treasure_i, buy_voidwaker]
      because: §16.2, judgment 1, on the account it was written about.
    - pair: [complete_desert_treasure_i, buy_high_risk_gear]
      because: >
        Same reasoning, and the gear set costs more while advancing deep_wildy_nh less than
        the Voidwaker does.
    # Deleted by Step 13b (§16.3 step 5): the `buy_voidwaker > buy_high_risk_gear`
    # judgment recorded here was **wrong**, and D1 in docs/TUNING.md is the ruling. An 85M
    # purchase against a 16.5M one is a five-fold difference and κ = 20M says 20M is where
    # cost starts to hurt; the six copies of this judgment were one opinion written six
    # times, and satisfying them all required `cost_decay: 0.1`, which ε caps at 0.63 and
    # which therefore switches cost off rather than rebalancing it. The scenario is kept —
    # its other judgments are unaffected.
    - pair: [complete_desert_treasure_i, train_woodcutting]
      because: Woodcutting advances nothing.
  top_3_contains:
    - id: complete_desert_treasure_i
      because: The one gate holding back three capabilities.
  must_not_be_top:
    - id: train_woodcutting
      because: Advances nothing.
