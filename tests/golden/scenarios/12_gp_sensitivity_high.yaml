# `06_maxed_pure`, with one field changed: `gp_sensitivity: high` (κ = 8M).
#
# §9.6's own table: at κ = 8M a 25M purchase scores 0.04 and a 50M one hits the ε floor. The
# Voidwaker's 85M hint is far past that; the AGS-plus-Ahrim's set is ~16.5M. Under
# "deprioritize expensive upgrades **strongly**", the cheaper set must win the pair that
# `06_maxed_pure` and `13_gp_sensitivity_low` both give to the Voidwaker.
#
# This scenario and 13 exist as a pair. Individually either could be satisfied by a
# degenerate κ; together they pin the *ordering* §9.6's validation block requires
# (high < normal < low) to a behavioural consequence rather than to a number.
id: gp_sensitivity_high
title: Same maxed pure, "deprioritize expensive upgrades strongly"
notes: >
  The κ knob is the only difference from 06. Prices are pinned so the judgment cannot be
  satisfied or broken by the live market moving.
player:
  synced: true
  combat_level: 90
  quest_points: 40
  gp_sensitivity: high
  skills:
    attack: 60
    strength: 99
    defence: 1
    magic: 94
    prayer: 52
    ranged: 99
    hitpoints: 99
    thieving: 60
    firemaking: 55
    slayer: 40
    woodcutting: 70
  unlocks:
    ancient_magicks: unlocked
    protect_item: unlocked
    rigour: locked
    spellbook_lunar: locked
  quests: {desert_treasure_i: complete, lunar_diplomacy: not_started}
  items: [mystic_robe_top]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: true}
    - {id: teleblock_understanding, achieved: true}
    - {id: successfully_freeze_log, achieved: true}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 2}
    - {id: consistent_overhead_prayers, achieved: true, practiced_days_ago: 2}
    - {id: freeze_logging_practice, achieved: true, practiced_days_ago: 2}
roadmaps: {main_nh: 1.0}
prices:
  voidwaker: {high_gp: 85000000, low_gp: 84000000, traded_hours_ago: 3}
  armadyl_godsword: {high_gp: 15000000, low_gp: 14800000, traded_hours_ago: 3}
  ahrims_robetop: {high_gp: 1500000, low_gp: 1480000, traded_hours_ago: 3}
judgments:
  must_rank_above:
    - pair: [buy_high_risk_gear, buy_voidwaker]
      because: >
        The user has said cost matters a great deal. At κ = 8M an 85M purchase is worth
        essentially nothing on the cost axis while a 16.5M one still scores ~0.13, and the
        Voidwaker's relevance advantage (0.80 against 0.50) is not five times.
        **This is the inverse of the same pair in 06 and 13, and that is the point.**
    - pair: [buy_high_risk_gear, train_woodcutting]
      because: Woodcutting advances nothing.
  must_not_be_top:
    - id: buy_voidwaker
      because: >
        Recommending the corpus's most expensive purchase first to a user who asked for cost
        to weigh heavily is the concrete failure §9.6's κ presets exist to prevent.
    - id: train_woodcutting
      because: Advances nothing.
