# A maxed pure: 94 Magic, 99 Strength, 1 Defence, 52 Prayer. Both skill grinds the corpus
# declares are already complete, so the actionable list is the two acquisitions plus
# Woodcutting — the case where cost_decay is doing nearly all the work.
#
# Rigour is permanently out of reach on a 1-Defence build (70 Defence), and the corpus has
# no way to say "never" — so the judgment about it is stated as an ordering, not as an
# exclusion.
id: maxed_pure
title: Maxed pure — the skill grinds are done
notes: >
  Deliberately the account with the fewest actionable candidates. It is the clearest test
  of the acquisition pair, since nothing else competes for the top slot.
player:
  synced: true
  combat_level: 90
  quest_points: 40
  gp_sensitivity: normal
  skills:
    attack: 60
    strength: 99
    defence: 1
    magic: 94
    prayer: 52
    ranged: 99
    hitpoints: 99
    thieving: 60
    firemaking: 55
    slayer: 40
    woodcutting: 70
  unlocks: {ancient_magicks: unlocked, protect_item: unlocked, rigour: locked, spellbook_lunar: locked}
  quests: {desert_treasure_i: complete, lunar_diplomacy: not_started}
  items: [mystic_robe_top]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: true}
    - {id: teleblock_understanding, achieved: true}
    - {id: successfully_freeze_log, achieved: true}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 2}
    - {id: consistent_overhead_prayers, achieved: true, practiced_days_ago: 2}
    - {id: freeze_logging_practice, achieved: true, practiced_days_ago: 2}
roadmaps: {main_nh: 1.0}
judgments:
  must_rank_above:
    - pair: [buy_voidwaker, buy_high_risk_gear]
      because: >
        The Voidwaker advances deep_wildy_nh 0.80 against the gear set's 0.50 and satisfies
        the same `any_of` on its own. At normal GP sensitivity relevance should win the pair
        despite the Voidwaker costing five times as much.
      pending_review: D1 in docs/TUNING.md — the v1 weights disagree.
    - pair: [buy_voidwaker, unlock_rigour]
      because: >
        Rigour needs 73 more Prayer and 69 more Defence on a build that will never train
        either; the Voidwaker is the account's only remaining route into deep Wilderness NH.
    - pair: [buy_voidwaker, train_woodcutting]
      because: Woodcutting advances nothing.
  top_3_contains:
    - id: buy_voidwaker
      because: The single highest-value remaining action for this build.
  must_not_be_top:
    - id: train_woodcutting
      because: Advances nothing.
    - id: unlock_rigour
      because: Unreachable on a 1-Defence build, and the corpus prices it as far away.
