# **§16.2's third named pairwise judgment lives here.**
#
#   "Rigour does NOT outrank Protect Item for an account below 25 Prayer, when Protect Item
#    gates initial Wilderness practice."
#
# 21 Prayer: below Protect Item's 25 and nowhere near Rigour's 74 Prayer / 70 Defence. The
# roadmap mixes main_nh with anti_pk so budget_nh — the capability Protect Item advances
# most (0.60) — carries real weight, which is what "gates initial Wilderness practice"
# means here.
id: low_prayer_protect_item
title: Below 25 Prayer, Protect Item gates first Wilderness trips
notes: >
  Rigour is the more exciting unlock and the one an untuned scorer is most likely to
  over-rank: it advances anti_pk more (0.40 against 0.30) and the roadmap blend gives
  anti_pk real weight. What must carry Protect Item is proximity — 21 Prayer is four levels
  from 25 and fifty-three from 74 — plus its budget_nh relevance.
player:
  synced: true
  combat_level: 84
  quest_points: 45
  gp_sensitivity: normal
  skills:
    attack: 70
    strength: 80
    defence: 62
    magic: 82
    prayer: 21
    ranged: 70
    hitpoints: 78
    thieving: 55
    firemaking: 52
    slayer: 25
    woodcutting: 50
  unlocks: {ancient_magicks: locked, protect_item: locked, rigour: locked, spellbook_lunar: locked}
  quests: {desert_treasure_i: not_started, lunar_diplomacy: not_started}
  items: [mystic_robe_top]
  scanned: all
  milestones:
    - {id: first_wilderness_kill, achieved: false}
    - {id: comfortable_4_way_switches, achieved: true, practiced_days_ago: 6}
roadmaps: {main_nh: 0.7, anti_pk: 0.3}
judgments:
  must_rank_above:
    - pair: [unlock_protect_item, unlock_rigour]
      because: >
        §16.2, judgment 3, stated for exactly the account it names. Protect Item is four
        Prayer levels away and makes the first Wilderness trips affordable; Rigour needs 74
        Prayer, 70 Defence and a raid this app does not model.
    - pair: [unlock_protect_item, train_woodcutting]
      because: Woodcutting advances nothing.
    - pair: [complete_desert_treasure_i, buy_voidwaker]
      because: §16.2, judgment 1 — Ancients are locked here too.
  must_not_be_top:
    - id: unlock_rigour
      because: >
        The absolute form of §16.2's third judgment. Coaching a 21-Prayer account toward
        Rigour is the concrete failure this scenario exists to catch.
    - id: train_woodcutting
      because: Advances nothing.
